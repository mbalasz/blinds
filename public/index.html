<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#fee6e3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Blinds Control</title>
    <link rel="stylesheet" href="style.css" />
    <script src="/socket.io/socket.io.js" defer></script>
    <script src="client.js" defer></script>
  </head>
  <body>
    <div class="app-container">
      <header class="app-header">
        <h1 class="app-title">Blinds Control</h1>
      </header>

      <main class="controls-container">
        <!-- Progress Visualization -->
        <div class="progress-section">
          <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
            <div class="progress-target" id="progress-target"></div>
            <div class="progress-label" id="progress-label">--</div>
          </div>
        </div>

        <!-- Main Controls -->
        <div class="main-controls">
          <button class="btn btn-primary btn-large" id="up-end" type="button" aria-label="Open blinds fully">
            <span class="btn-icon">⇈</span>
            <span class="btn-text">Fully Open</span>
          </button>

          <button class="btn btn-secondary" id="up" type="button" aria-label="Move blinds up">
            <span class="btn-icon">↑</span>
          </button>

          <button class="btn btn-secondary" id="down" type="button" aria-label="Move blinds down">
            <span class="btn-icon">↓</span>
          </button>

          <button class="btn btn-primary btn-large" id="down-end" type="button" aria-label="Close blinds fully">
            <span class="btn-icon">⇊</span>
            <span class="btn-text">Fully Close</span>
          </button>

          <button class="btn btn-stop" id="stop" type="button" aria-label="Stop blinds">
            <span class="btn-icon">■</span>
            <span class="btn-text">STOP</span>
          </button>
        </div>

        <!-- Reset Controls -->
        <div class="reset-controls">
          <button class="btn btn-reset" id="reset-up" type="button">
            Reset to Open
          </button>
          <button class="btn btn-reset" id="reset-down" type="button">
            Reset to Close
          </button>
        </div>
      </main>
    </div>
  </body>
</html>
